<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoundSlate</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --fg: #ffffff;
            --accent: #ffd400;
            --card: #1a1a1a;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 1.25rem;
            line-height: 1.6;
            background: var(--bg);
            color: var(--fg);
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: .25rem;
        }

        h2 {
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: .3rem;
        }

        label {
            display: block;
            margin-top: 1rem;
        }

        input[type=file] {
            display: block;
            width: 100%;
            margin: .6rem 0;
            color: var(--fg);
            font-size: 1.1rem;
        }

        select {
            font-size: 1.2rem;
            padding: .5rem;
            margin: .4rem 0;
        }

        button {
            font-size: 1.25rem;
            font-weight: bold;
            background: var(--accent);
            color: #000;
            border: 3px solid var(--accent);
            border-radius: 10px;
            padding: .8rem 1.2rem;
            margin: .4rem .4rem .4rem 0;
            cursor: pointer;
        }

        button.secondary {
            background: transparent;
            color: var(--accent);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        :focus-visible {
            outline: 4px solid #00e5ff;
            outline-offset: 3px;
        }

        #status {
            min-height: 1.6em;
            font-weight: bold;
            color: var(--accent);
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 260px;
            margin-top: 1rem;
            border-radius: 8px;
        }

        #result {
            display: none;
            background: var(--card);
            border-radius: 10px;
            padding: 1rem 1.2rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>SoundSlate</h1>
        <p>Choose a photo of a chart, diagram or handwritten page. SoundSlate describes it aloud.</p>

        <label for="file">Choose an image or take a photo</label>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp">

        <label for="lang">Language of description</label>
        <select id="lang">
            <option value="en">English</option>
            <option value="hi">हिन्दी (Hindi)</option>
        </select>

        <label><input id="auto" type="checkbox" checked> Read results aloud automatically</label>

        <button id="describeBtn">Describe image</button>
        <p id="status" role="status" aria-live="polite"></p>

        <img id="preview" alt="Preview of the image you selected">

        <section id="result" aria-label="Description of your image">
            <div role="group" aria-label="Listening controls">
                <button id="repeatBtn">Repeat</button>
                <button id="moreBtn">More detail</button>
                <button id="allBtn" class="secondary">Read everything</button>
                <button id="stopBtn" class="secondary">Stop</button>
            </div>
            <h2>Summary</h2>
            <p id="summary"></p>
            <h2>Details</h2>
            <ul id="details"></ul>
            <h2>Key values</h2>
            <ul id="values"></ul>
            <h2>Trend</h2>
            <p id="trend"></p>
            <h2>Confidence notes</h2>
            <p id="notes"></p>
        </section>

        <p>Shortcuts: Alt+R repeat, Alt+M more detail, Alt+A read everything, Alt+S stop.</p>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        let queue = [];      // the pieces "More detail" reads one by one
        let queuePos = 0;
        let lastSpoken = "";
        let summaryText = "";
        let resultLang = "en";   // language of the description being read

        function setStatus(msg) { $("status").textContent = msg; }

        // Browsers load their voice list a moment after the page opens
        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // Speak text with the browser's built-in voice
        function speak(text) {
            lastSpoken = text;
            if (!("speechSynthesis" in window)) {
                setStatus("Speech is not supported in this browser.");
                return;
            }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = resultLang === "hi" ? "hi-IN" : "en-IN";
            // Look for an installed voice that matches the language
            const voice = window.speechSynthesis.getVoices().find(
                (v) => v.lang.replace("_", "-").toLowerCase() === u.lang.toLowerCase()
            );
            if (voice) u.voice = voice;
            else if (resultLang === "hi") {
                setStatus("No Hindi voice found on this device. The text is shown on screen.");
            }
            u.rate = 0.95;
            window.speechSynthesis.speak(u);
        }

        // Fill the page with the description and prepare the spoken queue
        function show(r) {
            summaryText = r.summary;
            $("summary").textContent = r.summary;
            $("trend").textContent = r.trend || "None";
            $("notes").textContent = r.confidence_notes || "None";

            $("details").innerHTML = "";
            r.details.forEach((d) => {
                const li = document.createElement("li");
                li.textContent = d;
                $("details").appendChild(li);
            });

            $("values").innerHTML = "";
            r.key_values.forEach((kv) => {
                const li = document.createElement("li");
                li.textContent = kv.label + ": " + kv.value;
                $("values").appendChild(li);
            });

            queue = [...r.details, ...r.key_values.map((kv) => kv.label + ": " + kv.value)];
            if (r.trend) queue.push("Trend: " + r.trend);
            if (r.confidence_notes) queue.push("Note: " + r.confidence_notes);
            queuePos = 0;

            $("result").style.display = "block";
            if ($("auto").checked) speak(r.summary);
        }

        async function describe() {
            const file = $("file").files[0];
            if (!file) { setStatus("Please choose an image first."); $("file").focus(); return; }

            $("describeBtn").disabled = true;
            setStatus("Describing your image. This can take up to a minute.");
            $("preview").src = URL.createObjectURL(file);
            $("preview").style.display = "block";

            const form = new FormData();
            form.append("file", file);
            form.append("language", $("lang").value);
            try {
                const res = await fetch("/describe", { method: "POST", body: form });
                let data = null;
                try { data = await res.json(); } catch (e) { /* server sent plain text */ }
                if (!res.ok) {
                    throw new Error(
                        data && typeof data.detail === "string"
                            ? data.detail
                            : "The server had a problem (code " + res.status + "). Please try again."
                    );
                }
                resultLang = $("lang").value;
                $("result").lang = resultLang;
                show(data.result);
                setStatus("Done. Press Repeat or More detail to keep listening.");
            } catch (err) {
                setStatus("Sorry: " + err.message);
            } finally {
                $("describeBtn").disabled = false;
            }
        }

        function moreDetail() {
            if (!queue.length) return;
            if (queuePos >= queue.length) { speak("That is everything."); return; }
            speak(queue[queuePos++]);
        }

        $("describeBtn").addEventListener("click", describe);
        $("repeatBtn").addEventListener("click", () => speak(lastSpoken));
        $("moreBtn").addEventListener("click", moreDetail);
        $("allBtn").addEventListener("click", () => speak([summaryText, ...queue].join(". ")));
        $("stopBtn").addEventListener("click", () => window.speechSynthesis.cancel());

        // Alt+key shortcuts (plain letters would clash with screen reader keys)
        document.addEventListener("keydown", (e) => {
            if (!e.altKey || e.ctrlKey || e.metaKey) return;
            const k = e.key.toLowerCase();
            const actions = {
                r: () => speak(lastSpoken),
                m: moreDetail,
                a: () => speak([summaryText, ...queue].join(". ")),
                s: () => window.speechSynthesis.cancel(),
            };
            if (actions[k]) { e.preventDefault(); actions[k](); }
        });
    </script>
</body>

</html>
